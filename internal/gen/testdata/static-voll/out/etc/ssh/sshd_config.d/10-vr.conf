# Von vanilla-router erzeugt, nicht von Hand ändern.
# Änderungen über die Weboberfläche oder /etc/vanilla-router/config.json und `vrctl apply`.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthorizedKeysFile /etc/vanilla-router/ssh/%u.keys
AllowUsers admin
X11Forwarding no
AllowAgentForwarding no
