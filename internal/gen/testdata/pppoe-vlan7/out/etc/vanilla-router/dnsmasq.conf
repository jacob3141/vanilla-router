# Von vanilla-router erzeugt, nicht von Hand ändern.
# Änderungen über die Weboberfläche oder /etc/vanilla-router/config.json und `vrctl apply`.

# Nur im Heimnetz, nie am Internet-Anschluss
interface=lan0
bind-dynamic
no-hosts

# DNS
domain-needed
bogus-priv
stop-dns-rebind
rebind-localhost-ok
rebind-domain-ok=/home.arpa/
local=/home.arpa/
domain=home.arpa,192.168.42.0/24,local
cache-size=10000
no-resolv
server=9.9.9.9
server=2620:fe::fe

# Namen im Heimnetz
host-record=router.home.arpa,router,192.168.42.1,fd12:3456:789a:1::1

# DHCPv4
dhcp-range=lan0,192.168.42.100,192.168.42.249,255.255.255.0,12h
dhcp-option=lan0,option:router,192.168.42.1
dhcp-option=lan0,option:dns-server,192.168.42.1
dhcp-option=lan0,option:domain-search,home.arpa
dhcp-authoritative
dhcp-rapid-commit
dhcp-leasefile=/var/lib/vanilla-router/dnsmasq.leases
