# Nach einer Kernel-Panik nach 10 s neu starten. Bricht ein Start nach einem Update so ab, wählt GRUB
# beim nächsten Start den Stand vor dem Update (42_vanilla_router). Ein Router soll nie stehen bleiben.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT panic=10"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=10
