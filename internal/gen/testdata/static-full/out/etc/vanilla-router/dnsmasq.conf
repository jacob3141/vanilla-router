# Generated by vanilla-router, do not edit by hand.
# Make changes through the web interface or /etc/vanilla-router/config.json and `vrctl apply`.

# Only in the home network, never on the internet port
interface=lan0
bind-dynamic
no-hosts

# DNS
domain-needed
bogus-priv
stop-dns-rebind
rebind-localhost-ok
rebind-domain-ok=/home.arpa/
local=/home.arpa/
domain=home.arpa,192.168.42.0/24,local
cache-size=10000
resolv-file=/run/systemd/resolve/resolv.conf

# Names in the home network
host-record=router.home.arpa,router,192.168.42.1
host-record=printer.home.arpa,printer,192.168.42.20
host-record=nas.home.arpa,nas,192.168.42.21
host-record=camera.home.arpa,camera,192.168.42.30

# DHCPv4
dhcp-range=lan0,192.168.42.100,192.168.42.249,255.255.255.0,12h
dhcp-option=lan0,option:router,192.168.42.1
dhcp-option=lan0,option:dns-server,192.168.42.1
dhcp-option=lan0,option:domain-search,home.arpa
dhcp-authoritative
dhcp-rapid-commit
dhcp-leasefile=/var/lib/vanilla-router/dnsmasq.leases
dhcp-host=02:00:00:00:00:10,192.168.42.20,printer
dhcp-host=02:00:00:00:00:11,192.168.42.21,nas
