# Generated by vanilla-router, do not edit by hand.
# Make changes through the web interface or /etc/vanilla-router/config.json and `vrctl apply`.
[global]
   workgroup = WORKGROUP
   server string = %h
   server role = standalone server
   server min protocol = SMB3
   server signing = mandatory
   smb encrypt = required
   interfaces = lo lan0
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.42.0/24
   hosts deny = 0.0.0.0/0
   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[guest]
   path = /media/shares/guest
   read only = no
   browsable = yes
   valid users = smbuser
   create mask = 0664
   directory mask = 0775
