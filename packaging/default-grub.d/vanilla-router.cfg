# Restart 10 s after a kernel panic. If a start after an update aborts like this, GRUB picks
# the state before the update at the next start (42_vanilla_router). A router should never stay down.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT panic=10"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=3
GRUB_RECORDFAIL_TIMEOUT=10
