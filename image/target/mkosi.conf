# SPDX-License-Identifier: AGPL-3.0-or-later
# Target system: Ubuntu Server 26.04 as a tar archive. The installer unpacks it onto the disk
# (D-07, D-12). Package source main only (NF-09).

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main
Architecture=x86-64

[Output]
Format=tar
CompressOutput=zstd
Output=rootfs

[Content]
Bootable=no
# Packages: image/packages.txt and image/packages-image.txt, passed by build.sh (one source, NF-09)
Packages=vanilla-router
PackageDirectories=../../dist
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC
Hostname=router
RootPassword=!
