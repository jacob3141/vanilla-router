# dnsmasq runs as this user after the start (vr-dnsmasq.service). If it already exists
# (e.g. through the package dnsmasq), it stays unchanged.
u dnsmasq - "dnsmasq (vanilla-router)" /nonexistent
# Web interface without root (D-04)
u vr-webui - "vanilla-router web interface" /var/lib/vanilla-router/webui
# Connection to the access points, may call only the actions ap.* of the helper (D-04)
u vr-apd - "vanilla-router access point service" /nonexistent
m vr-apd vr-webui
# Owner of the file share, also the Samba account
u smbuser - "vanilla-router file share" /nonexistent /usr/sbin/nologin
m smbuser vr-webui
