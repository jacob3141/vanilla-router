# SPDX-License-Identifier: AGPL-3.0-or-later
# Boot stick: a small Ubuntu with the installation assistant on tty1 and the image of the target system.
# Boots with Secure Boot through Ubuntu's signed shim/GRUB (Q-16).

[Distribution]
Distribution=ubuntu
Release=resolute
# universe only for mkosi's default initrd (Ubuntu has systemd-repart in universe). The target
# system stays with main (NF-09), the stick's packages come from image/packages-stick.txt.
Repositories=main,universe
Architecture=x86-64

[Output]
Format=disk
Output=vanilla-router-stick
CompressOutput=no

[Content]
Bootable=yes
Bootloader=grub-signed
ShimBootloader=signed
UnifiedKernelImages=no
# Keep the console free of messages for the assistant
KernelCommandLine=quiet loglevel=3 systemd.show_status=false console=tty1
# Packages: image/packages-stick.txt, passed by build.sh
Packages=vanilla-router
PackageDirectories=../../dist
# Image of the target system (put here by build.sh) and the unit for the assistant
ExtraTrees=mkosi.extra
ExtraTrees=../../dist/stick-extra
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC
Hostname=vanilla-router-installer
RootPassword=!
