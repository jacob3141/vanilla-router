# Boot-Stick: kleines Ubuntu mit dem Installations-Assistenten auf tty1 und dem Image des Zielsystems.
# Bootet mit Secure Boot über die signierten shim/GRUB von Ubuntu (Q-16). Ungetestet mit mkosi.

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main
Architecture=x86-64

[Output]
Format=disk
Output=vanilla-router-stick
CompressOutput=no

[Content]
Bootable=yes
Bootloader=grub
ShimBootloader=signed
UnifiedKernelImages=no
KernelCommandLine=quiet console=tty1
# Pakete: image/packages-stick.txt, übergeben von build.sh
Packages=vanilla-router
PackageDirectories=../../dist
# Image des Zielsystems (von build.sh hierher gelegt) und die Unit für den Assistenten
ExtraTrees=mkosi.extra
ExtraTrees=../../dist/stick-extra
Locale=de_DE.UTF-8
Keymap=de
Timezone=Europe/Berlin
Hostname=vanilla-router-installer
RootPassword=!
