# dnsmasq läuft nach dem Start als dieser Benutzer (vr-dnsmasq.service). Existiert er schon
# (z. B. durch das Paket dnsmasq), bleibt er unverändert.
u dnsmasq - "dnsmasq (vanilla-router)" /nonexistent
# Weboberfläche ohne Root (D-04)
u vr-webui - "vanilla-router Weboberfläche" /var/lib/vanilla-router/webui
