# SPDX-License-Identifier: AGPL-3.0-or-later
# Zielsystem: Ubuntu Server 26.04 als Tar-Archiv. Der Installer entpackt es auf die Festplatte
# (D-07, D-12). Nur Paketquelle main (NF-09). Ungetestet mit mkosi, Stand 2026-11-04 (siehe image/README.md).

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main
Architecture=x86-64

[Output]
Format=tar
CompressOutput=zstd
Output=rootfs

[Content]
Bootable=no
# Pakete: image/packages.txt und image/packages-image.txt, übergeben von build.sh (eine Quelle, NF-09)
Packages=vanilla-router
PackageDirectories=../../dist
Locale=de_DE.UTF-8
Keymap=de
Timezone=Europe/Berlin
Hostname=router
RootPassword=!
